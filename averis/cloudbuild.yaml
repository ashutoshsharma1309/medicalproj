# ===========================================================================
# AVERIS — Google Cloud Build → Artifact Registry → Cloud Run
#
# Public (NEXT_PUBLIC_*) values are build args because Next.js inlines them
# into the client bundle. Server-only secrets (SUPABASE_SERVICE_ROLE_KEY,
# GROK_API_KEY) are NEVER build args — they are bound at deploy time from
# Secret Manager so they never enter an image layer.
#
# One-time setup:
#   gcloud artifacts repositories create averis --repository-format=docker \
#     --location=$_REGION
#   printf '%s' "$GROK_API_KEY" | gcloud secrets create grok-api-key --data-file=-
# ===========================================================================

substitutions:
  _REGION: asia-south1
  _REPOSITORY: averis
  _SERVICE: averis
  _SUPABASE_URL: ""       # https://<project-ref>.supabase.co
  _SUPABASE_ANON_KEY: ""  # publishable key
  _SITE_URL: ""           # https://averis.example.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},NEXT_PUBLIC_SITE_URL=${_SITE_URL},GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION}
      - --set-secrets=GROK_API_KEY=grok-api-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
