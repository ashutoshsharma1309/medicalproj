; ===========================================================================
; AVERIS wearable — ESP32 firmware
;
;   pio run                    build
;   pio run -t upload          flash
;   pio device monitor         serial
;   test/run.sh                logic tests, no hardware needed
;
; Library versions are pinned. A wearable that builds differently on two
; machines is a wearable whose behaviour in the field cannot be traced back to
; a commit — and "it worked on the bench" is not a defensible answer about
; something a patient is wearing.
; ===========================================================================
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Warnings on. The bugs this catches on an ESP32 — a truncated snprintf, a
    ; signed/unsigned comparison inside a bounds check — are exactly the ones
    ; that present in the field as a band which reboots once a day.
    -Wall
    -Wextra

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    adafruit/Adafruit MLX90614 Library@2.1.5
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit Unified Sensor@1.1.14
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11

; Room for OTA. Not implemented in this phase, and the space is reserved
; anyway: repartitioning a fleet of bands that are already on wrists is not
; something that can be done remotely, which makes it the one decision that has
; to be right before shipping rather than after.
board_build.partitions = default.csv

; The host tests are not a PlatformIO test environment on purpose. `pio test`
; would make running them depend on installing PlatformIO, and the whole value
; of Arduino-free headers is that CI can compile them with the compiler it
; already has. See test/run.sh.
