# =============================================================================
# AVERIS — AI inference service
#
# Split from ci.yml because it has a different trigger surface: this runs when
# the engine or the service changes, not when a React component does. A
# monolithic pipeline that rebuilds a scientific-stack container because
# somebody edited a button is a pipeline people learn to ignore.
# =============================================================================

name: AI service

on:
  push:
    branches: [main]
    paths:
      - "averis/ai_engine/**"
      - "averis/services/ai-service/**"
      - "averis/ml/**"
      - ".github/workflows/ai.yml"
  pull_request:
    paths:
      - "averis/ai_engine/**"
      - "averis/services/ai-service/**"
      - "averis/ml/**"
      - ".github/workflows/ai.yml"
  workflow_dispatch:

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: averis

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r iot-service/requirements.txt -r iot-service/requirements-dev.txt
          pip install -r services/ai-service/requirements.txt

      - name: Engine and service tests
        run: python -m pytest ai_engine/tests services/ai-service/tests -q

      # The service must start with the models it claims to serve. A container
      # that boots and fails on the first real assessment turns a deploy into an
      # outage discovered by a patient's deterioration.
      - name: Service starts and serves
        env:
          AI_SERVICE_TOKEN: ci-token
        run: |
          python -m uvicorn app.main:app --app-dir services/ai-service --port 8100 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/api/health/live >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8100/api/health/ready | tee /dev/stderr | grep -q '"status":"ready"'

          # Unauthenticated requests must be refused. The default when
          # AI_SERVICE_TOKEN is unset is to refuse everything, and this asserts
          # the configured path still checks.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://127.0.0.1:8100/api/v1/assess -d '{"readings":[]}')
          test "$code" = "401" || { echo "::error::unauthenticated assess returned $code"; exit 1; }

  build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f services/ai-service/Dockerfile -t averis-ai:${{ github.sha }} .

      # The image must not run as root. This service takes arbitrary numeric
      # input through a scientific stack, which is the last place to be root.
      - name: Refuse a root container
        run: |
          user=$(docker run --rm --entrypoint sh averis-ai:${{ github.sha }} -c 'id -u')
          test "$user" != "0" || { echo "::error::AI service image runs as root"; exit 1; }

      # The image must also *run*. A build-only job passes on an image whose
      # process dies on import — which is exactly what happened here: the module
      # located ai_engine by counting parent directories, the count was right for
      # the development layout and wrong inside the container, and the build was
      # green while the container exited 1 every time it started.
      - name: The container starts and serves
        run: |
          docker run -d --name ai-check -e AI_SERVICE_TOKEN=ci-token \
            -p 8100:8100 averis-ai:${{ github.sha }}

          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8100/api/health/live >/dev/null && break
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:8100/api/health/ready | tee /dev/stderr | grep -q '"vitals_engine":true'; then
            echo "::error::the container did not become ready"
            docker logs ai-check
            exit 1
          fi

          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://127.0.0.1:8100/api/v1/assess -d '{"readings":[]}')
          test "$code" = "401" || { echo "::error::unauthenticated assess returned $code"; docker logs ai-check; exit 1; }

          docker rm -f ai-check
