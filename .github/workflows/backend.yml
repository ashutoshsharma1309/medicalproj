# =============================================================================
# AVERIS — ingest service and database
#
# The two things that must be right before anything else matters: readings are
# accepted only from authenticated devices, and one patient cannot read
# another's records.
# =============================================================================

name: Backend

on:
  push:
    branches: [main]
    paths:
      - "averis/iot-service/**"
      - "averis/supabase/**"
      - "averis/scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "averis/iot-service/**"
      - "averis/supabase/**"
      - "averis/scripts/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: averis

jobs:
  ingest:
    name: Ingest service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r iot-service/requirements.txt -r iot-service/requirements-dev.txt

      # The wire-contract vectors are the load-bearing part: the same payloads
      # run against this validator and the TypeScript one. A payload accepted by
      # one and rejected by the other fails here rather than in the field.
      - name: Tests
        run: python -m pytest iot-service/tests -q

  database:
    name: Schema and Row Level Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: averis
          POSTGRES_PASSWORD: averis
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U averis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # The job that matters most in the whole pipeline. Every other check
      # verifies that AVERIS works; this verifies that one patient cannot read
      # another's records — against the unmodified production migrations, so a
      # policy change that opens a hole fails here rather than in production.
      - name: Migrations, schema validation and RLS assertions
        env:
          PGPASSWORD: averis
          PGHOST: localhost
          PG_MODE: psql
          PG_USER: averis
        run: ./supabase/tests/run.sh

  image:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ingest]

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f iot-service/Dockerfile -t averis-iot:${{ github.sha }} .

      - name: Refuse a root container
        run: |
          user=$(docker run --rm --entrypoint sh averis-iot:${{ github.sha }} -c 'id -u')
          test "$user" != "0" || { echo "::error::ingest image runs as root"; exit 1; }
